workflows:
  ios-native-production:
    name: Any Distance Build (iPhone + Watch)
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Build Key"
    environment:
      vars:
        XCODE_WORKSPACE: "ADAC/ADAC.xcworkspace"
        XCODE_SCHEME: "ADAC"
    scripts:
      - name: Initialize Keychain
        script: keychain initialize
        
      - name: Fetch Signing Files (ALL Targets)
        script: |
          # Go to project folder to detect all IDs (App, Watch, Widget, etc)
          cd ADAC
          # Fetch profiles for the main app AND all extensions automatically
          app-store-connect fetch-signing-files "$(xcode-project detect-bundle-id)" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          
      - name: Install CocoaPods (Hard Reset)
        script: |
          cd ADAC
          rm -rf Pods
          rm -f Podfile.lock
          gem install cocoapods
          pod install --repo-update
          cd ..
          
      - name: Build and Sign (iPhone + Watch)
        script: |
          # FIX 1: Removed "-sdk iphoneos" so the Watch App is built correctly
          # FIX 2: Added CODE_SIGN_STYLE="Manual" to stop the "No Accounts" error
          xcodebuild -workspace "$XCODE_WORKSPACE" \
          -scheme "$XCODE_SCHEME" \
          -configuration Release \
          -archivePath build/MyApp.xcarchive \
          -allowProvisioningUpdates \
          CODE_SIGN_STYLE="Manual" \
          archive
          
      - name: Generate Artifact
        script: |
          xcodebuild -exportArchive \
          -archivePath build/MyApp.xcarchive \
          -exportPath build/ \
          -exportOptionsPlist export_options.plist
          
    artifacts:
      - build/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true