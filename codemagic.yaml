workflows:
  ios-native-production:
    name: Native iOS Build
    instance_type: mac_mini_m2
    environment:
      vars:
        # UPDATED PATH: Points to the workspace inside the ADAC folder
        XCODE_WORKSPACE: "ADAC/ADAC.xcworkspace"
        # Scheme name usually stays the same
        XCODE_SCHEME: "ADAC"
    integrations:
      app_store_connect: "Codemagic Build Key"
    scripts:
      - name: Initialize Keychain
        script: keychain initialize
      - name: Install CocoaPods
        script: |
          # Navigate into the folder where the Podfile lives
          cd ADAC
          gem install cocoapods
          pod install
          # Go back to root for the build command
          cd ..
      - name: Build and Sign IPA
        script: |
          xcodebuild -workspace "$XCODE_WORKSPACE" \
          -scheme "$XCODE_SCHEME" \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/MyApp.xcarchive archive \
          PROVISIONING_PROFILE_SPECIFIER="" \
          CODE_SIGN_STYLE="Manual" \
          CODE_SIGN_IDENTITY="$CM_CERTIFICATE_IDENTITY"
      - name: Generate Artifact
        script: |
          xcodebuild -exportArchive \
          -archivePath build/MyApp.xcarchive \
          -exportPath build/ \
          -exportOptionsPlist export_options.plist
    artifacts:
      - build/*.ipa