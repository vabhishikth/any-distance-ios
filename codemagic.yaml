workflows:
  ios-native-production:
    name: Any Distance Build (iPhone + Watch)
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Build Key"
    environment:
      vars:
        XCODE_WORKSPACE: "ADAC/ADAC.xcworkspace"
        XCODE_SCHEME: "ADAC"
    scripts:
      - name: Initialize Keychain
        script: keychain initialize
        
      - name: Fetch Signing Files (ALL Targets)
        script: |
          # This command is updated to find EVERY bundle ID in your project 
          # including the Widget, Watch app, and OneSignal
          cd ADAC
          app-store-connect fetch-signing-files --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          
      - name: Install CocoaPods (Hard Reset)
        script: |
          cd ADAC
          # Completely wipe the old pod state to fix the .xcconfig errors
          rm -rf Pods
          rm -f Podfile.lock
          gem install cocoapods
          pod install --repo-update
          cd ..
          
      - name: Build and Sign (iPhone + Watch Ultra)
        script: |
          # We use -destination to clarify the platform for the Watch component
          # and -allowProvisioningUpdates to solve the signing mismatch
          xcodebuild -workspace "$XCODE_WORKSPACE" \
          -scheme "$XCODE_SCHEME" \
          -sdk iphoneos \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/MyApp.xcarchive \
          -allowProvisioningUpdates \
          archive
          
      - name: Generate Artifact
        script: |
          xcodebuild -exportArchive \
          -archivePath build/MyApp.xcarchive \
          -exportPath build/ \
          -exportOptionsPlist export_options.plist
          
    artifacts:
      - build/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true