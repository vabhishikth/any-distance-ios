workflows:
  ios-native-production:
    name: Any Distance Build (iPhone + Watch)
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Build Key"
    environment:
      vars:
        XCODE_WORKSPACE: "ADAC/ADAC.xcworkspace"
        XCODE_SCHEME: "ADAC"
    scripts:
      - name: Initialize Keychain
        script: keychain initialize
        
      - name: Fetch Signing Files (ALL Targets)
        script: |
          cd ADAC
          # Fetch signing files for ALL bundle IDs in the workspace
          app-store-connect fetch-signing-files --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          cd ..
          
      - name: Install CocoaPods (Hard Reset)
        script: |
          cd ADAC
          # Completely wipe the old pod state to fix the .xcconfig errors
          rm -rf Pods
          rm -f Podfile.lock
          gem install cocoapods
          pod install --repo-update
          cd ..
          
      - name: Build and Sign (iPhone + Watch Ultra)
        script: |
          # Build from within ADAC directory so CocoaPods paths work correctly
          # Remove -destination flag to let xcodebuild handle multi-platform targets
          cd ADAC
          xcodebuild -workspace "ADAC.xcworkspace" \
          -scheme "ADAC" \
          -configuration Release \
          -archivePath ../build/MyApp.xcarchive \
          -allowProvisioningUpdates \
          archive
          cd ..
          
      - name: Generate Artifact
        script: |
          xcodebuild -exportArchive \
          -archivePath build/MyApp.xcarchive \
          -exportPath build/ \
          -exportOptionsPlist ADAC/export_options.plist
          
    artifacts:
      - build/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true