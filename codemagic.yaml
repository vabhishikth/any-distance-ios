workflows:
  ios-native-production:
    name: Any Distance Build (iPhone + Watch)
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Build Key"
    environment:
      vars:
        XCODE_WORKSPACE: "ADAC.xcworkspace"
        XCODE_SCHEME: "ADAC"
    scripts:
      - name: Initialize Keychain
        script: keychain initialize
        
      - name: Install CocoaPods
        script: |
          cd ADAC
          rm -rf Pods Podfile.lock
          pod install --repo-update
          # Verify pods installed correctly
          ls -la Pods/
          
      - name: Fetch Signing Files (ALL Targets)
        script: |
          cd ADAC
          # Fetch signing for each bundle ID explicitly
          app-store-connect fetch-signing-files "com.anydistance.anydistance" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.anydistance.anydistance.Widget" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.anydistance.anydistance.OneSignalNotificationServiceExtension" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.anydistance.anydistance.watchkitapp" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.anydistance.anydistance.watchkitapp.watchkitextension" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          
      - name: Build and Sign
        script: |
          cd ADAC
          xcodebuild -workspace "$XCODE_WORKSPACE" \
          -scheme "$XCODE_SCHEME" \
          -configuration Release \
          -archivePath "$CM_BUILD_DIR/build/MyApp.xcarchive" \
          -allowProvisioningUpdates \
          archive
          
      - name: Generate Artifact
        script: |
          xcodebuild -exportArchive \
          -archivePath "$CM_BUILD_DIR/build/MyApp.xcarchive" \
          -exportPath "$CM_BUILD_DIR/build/" \
          -exportOptionsPlist "$CM_BUILD_DIR/ADAC/export_options.plist"
          
    artifacts:
      - build/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true