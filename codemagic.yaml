workflows:
  ios-native-production:
    name: Any Distance Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Build Key"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vabhishikth.anydistance
        # Reference the certificates we created in the Codemagic UI
        provisioning_profiles: []
        certificates:
          - name: "Any Distance Distribution"
          - name: "Any Distance Development"
      vars:
        XCODE_WORKSPACE: "ADAC/ADAC.xcworkspace"
        XCODE_SCHEME: "ADAC"
    scripts:
      - name: Initialize Keychain
        script: keychain initialize
        
      - name: Install CocoaPods
        script: |
          cd ADAC
          rm -rf Pods Podfile.lock
          gem install cocoapods-keys
          pod keys set WahooConsumerKey_Sandbox dummy
          pod keys set WahooConsumerSecret_Sandbox dummy
          pod keys set WahooConsumerKey dummy
          pod keys set WahooConsumerSecret dummy
          pod keys set GarminConsumerKey_Sandbox dummy
          pod keys set GarminConsumerSecret_Sandbox dummy
          pod keys set GarminConsumerKey dummy
          pod keys set GarminConsumerSecret dummy
          pod install --repo-update
          
      - name: Setup Code Signing
        script: |
          # Add certificates from Codemagic UI
          keychain add-certificates
          
          # Show what certificates we have
          echo "=== Available Certificates ==="
          security find-identity -v -p codesigning
          
          cd ADAC
          
          # Apply profiles to project
          xcode-project use-profiles --project ADAC.xcodeproj || true
          
      - name: Build App
        script: |
          cd ADAC
          xcodebuild -workspace "ADAC.xcworkspace" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath ../build/ADAC.xcarchive \
            -allowProvisioningUpdates \
            archive
          
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ADAC.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist ADAC/export_options.plist
          
    artifacts:
      - build/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true