workflows:
  ios-native-production:
    name: Any Distance Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Build Key"
    environment:
      vars:
        XCODE_SCHEME: "ADAC"
    scripts:
      - name: Initialize Keychain
        script: keychain initialize
        
      - name: Install CocoaPods
        script: |
          cd ADAC
          rm -rf Pods Podfile.lock
          gem install cocoapods-keys
          # Set dummy keys (README says this is fine)
          pod keys set WahooConsumerKey_Sandbox dummy
          pod keys set WahooConsumerSecret_Sandbox dummy
          pod keys set WahooConsumerKey dummy
          pod keys set WahooConsumerSecret dummy
          pod keys set GarminConsumerKey_Sandbox dummy
          pod keys set GarminConsumerSecret_Sandbox dummy
          pod keys set GarminConsumerKey dummy
          pod keys set GarminConsumerSecret dummy
          pod install --repo-update
          
      - name: Fetch Signing Files
        script: |
          cd ADAC
          app-store-connect fetch-signing-files "com.anydistance.anydistance" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.anydistance.anydistance.Widget" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.anydistance.anydistance.OneSignalNotificationServiceExtension" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.anydistance.anydistance.watchkitapp" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.anydistance.anydistance.watchkitapp.watchkitextension" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          
      - name: Build App
        script: |
          cd ADAC
          xcodebuild -workspace "ADAC.xcworkspace" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath ../build/ADAC.xcarchive \
            -allowProvisioningUpdates \
            archive
          
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ADAC.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist ADAC/export_options.plist
          
    artifacts:
      - build/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true