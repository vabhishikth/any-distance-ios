workflows:
  ios-native-production:
    name: Any Distance Build (iPhone + Watch)
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Build Key"
    environment:
      vars:
        XCODE_WORKSPACE: "ADAC.xcworkspace"
        XCODE_SCHEME: "ADAC"
      groups:
        - wahoo_keys  # Add your API keys here in Codemagic UI
    scripts:
      - name: Initialize Keychain
        script: keychain initialize
        
      - name: Install CocoaPods
        script: |
          cd ADAC
          # Remove old state
          rm -rf Pods Podfile.lock
          # Install cocoapods-keys plugin
          gem install cocoapods-keys
          # Set placeholder keys for CI build (replace with actual keys in Codemagic environment variables)
          bundle config set --local path 'vendor/bundle' || true
          pod keys set WahooConsumerKey_Sandbox "${WAHOO_CONSUMER_KEY_SANDBOX:-placeholder}"
          pod keys set WahooConsumerSecret_Sandbox "${WAHOO_CONSUMER_SECRET_SANDBOX:-placeholder}"
          pod keys set WahooConsumerKey "${WAHOO_CONSUMER_KEY:-placeholder}"
          pod keys set WahooConsumerSecret "${WAHOO_CONSUMER_SECRET:-placeholder}"
          pod keys set GarminConsumerKey_Sandbox "${GARMIN_CONSUMER_KEY_SANDBOX:-placeholder}"
          pod keys set GarminConsumerSecret_Sandbox "${GARMIN_CONSUMER_SECRET_SANDBOX:-placeholder}"
          pod keys set GarminConsumerKey "${GARMIN_CONSUMER_KEY:-placeholder}"
          pod keys set GarminConsumerSecret "${GARMIN_CONSUMER_SECRET:-placeholder}"
          # Install pods
          pod install --repo-update
          echo "=== Pods installed ==="
          ls -la Pods/
          
      - name: Fetch Signing Files (ALL Targets)
        script: |
          cd ADAC
          # Fetch for each bundle ID explicitly with App Store type
          app-store-connect fetch-signing-files "com.anydistance.anydistance" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.anydistance.anydistance.Widget" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.anydistance.anydistance.OneSignalNotificationServiceExtension" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.anydistance.anydistance.watchkitapp" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.anydistance.anydistance.watchkitapp.watchkitextension" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          
      - name: Build and Sign (iPhone + Watch)
        script: |
          cd ADAC
          xcodebuild -workspace "ADAC.xcworkspace" \
          -scheme "ADAC" \
          -configuration Release \
          -archivePath ../build/MyApp.xcarchive \
          -allowProvisioningUpdates \
          archive
          
      - name: Generate Artifact
        script: |
          xcodebuild -exportArchive \
          -archivePath build/MyApp.xcarchive \
          -exportPath build/ \
          -exportOptionsPlist ADAC/export_options.plist
          
    artifacts:
      - build/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true