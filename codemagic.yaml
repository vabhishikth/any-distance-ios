workflows:
  ios-native-production:
    name: Native iOS Build
    instance_type: mac_mini_m2
    environment:
      vars:
        # Path to your workspace
        XCODE_WORKSPACE: "ADAC/ADAC.xcworkspace"
        # Scheme name
        XCODE_SCHEME: "ADAC"
    integrations:
      app_store_connect: "Codemagic Build Key"
    scripts:
      - name: Initialize Keychain
        script: keychain initialize
        
      - name: Fetch Signing Files & Create Profiles
        script: |
          # Go into the folder so we can find the project file
          cd ADAC
          
          # 1. Ask Apple for the certificates and profiles (Create them if missing)
          # We use "IOS_APP_STORE" so we can upload to TestFlight
          app-store-connect fetch-signing-files "$(xcode-project detect-bundle-id)" --type IOS_APP_STORE --create
          
          # 2. Setup the keychain
          keychain add-certificates
          
          # 3. Force Xcode to use these new profiles
          xcode-project use-profiles
          
      - name: Install CocoaPods
        script: |
          cd ADAC
          gem install cocoapods
          pod install
          
      - name: Build and Sign IPA
        script: |
          # We removed the manual signing flags because "use-profiles" set them up for us above
          xcodebuild -workspace "$XCODE_WORKSPACE" \
          -scheme "$XCODE_SCHEME" \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/MyApp.xcarchive archive
          
      - name: Generate Artifact
        script: |
          xcodebuild -exportArchive \
          -archivePath build/MyApp.xcarchive \
          -exportPath build/ \
          -exportOptionsPlist export_options.plist
    artifacts:
      - build/*.ipa