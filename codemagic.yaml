workflows:
  ios-native-production:
    name: Native iOS Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Build Key" # This must match your Integration name exactly
    environment:
      vars:
        XCODE_WORKSPACE: "ADAC/ADAC.xcworkspace"
        XCODE_SCHEME: "ADAC"
    scripts:
      - name: Initialize Keychain
        script: keychain initialize
        
      - name: Fetch Signing Files from Apple
        script: |
          # Automatically downloads certificates and profiles
          app-store-connect fetch-signing-files "$(xcode-project detect-bundle-id)" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          
      - name: Install CocoaPods (Clean Reset)
        script: |
          cd ADAC
          rm -rf Pods
          rm -f Podfile.lock
          gem install cocoapods
          pod repo update
          pod install --repo-update
          cd ..
          
      - name: Build and Sign IPA
        script: |
          xcodebuild -workspace "$XCODE_WORKSPACE" \
          -scheme "$XCODE_SCHEME" \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/MyApp.xcarchive archive
          
      - name: Generate Artifact
        script: |
          xcodebuild -exportArchive \
          -archivePath build/MyApp.xcarchive \
          -exportPath build/ \
          -exportOptionsPlist export_options.plist
          
    artifacts:
      - build/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true