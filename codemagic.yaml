workflows:
  ios-native-production:
    name: Any Distance Build
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ADAC/ADAC.xcworkspace"
        XCODE_SCHEME: "ADAC"
        APP_STORE_CONNECT_ISSUER_ID: "14d92899-1527-4b51-acc5-d4e98a7445d9"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "G24PDPXM4G"
    scripts:
      - name: Initialize Keychain
        script: keychain initialize
        
      - name: Install CocoaPods
        script: |
          cd ADAC
          rm -rf Pods Podfile.lock
          gem install cocoapods-keys
          pod keys set WahooConsumerKey_Sandbox dummy
          pod keys set WahooConsumerSecret_Sandbox dummy
          pod keys set WahooConsumerKey dummy
          pod keys set WahooConsumerSecret dummy
          pod keys set GarminConsumerKey_Sandbox dummy
          pod keys set GarminConsumerSecret_Sandbox dummy
          pod keys set GarminConsumerKey dummy
          pod keys set GarminConsumerSecret dummy
          pod install --repo-update
          
      - name: Fetch Signing Files
        script: |
          cd ADAC
          
          # Fetch signing files with explicit credentials
          app-store-connect fetch-signing-files "com.vabhishikth.anydistance" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --type IOS_APP_STORE --create --verbose
          
          app-store-connect fetch-signing-files "com.vabhishikth.anydistance.Widget" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --type IOS_APP_STORE --create --verbose
          
          app-store-connect fetch-signing-files "com.vabhishikth.anydistance.NotificationService" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --type IOS_APP_STORE --create --verbose
          
          app-store-connect fetch-signing-files "com.vabhishikth.anydistance.watchkitapp" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --type IOS_APP_STORE --create --verbose
          
          app-store-connect fetch-signing-files "com.vabhishikth.anydistance.watchkitapp.watchkitextension" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --type IOS_APP_STORE --create --verbose
          
          # Add certificates to keychain
          keychain add-certificates
          
          # Apply profiles to Xcode project
          xcode-project use-profiles --project ADAC.xcodeproj
          
      - name: Build App
        script: |
          cd ADAC
          xcodebuild -workspace "ADAC.xcworkspace" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath ../build/ADAC.xcarchive \
            CODE_SIGN_STYLE="Manual" \
            archive
          
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ADAC.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist ADAC/export_options.plist
          
    artifacts:
      - build/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true