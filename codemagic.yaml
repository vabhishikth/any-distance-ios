workflows:
  ios-native-production:
    name: Any Distance Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Build Key"
    environment:
      vars:
        XCODE_WORKSPACE: "ADAC/ADAC.xcworkspace"
        XCODE_SCHEME: "ADAC"
    scripts:
      - name: Initialize Keychain
        script: keychain initialize
        
      - name: Install CocoaPods
        script: |
          cd ADAC
          rm -rf Pods Podfile.lock
          gem install cocoapods-keys
          pod keys set WahooConsumerKey_Sandbox dummy
          pod keys set WahooConsumerSecret_Sandbox dummy
          pod keys set WahooConsumerKey dummy
          pod keys set WahooConsumerSecret dummy
          pod keys set GarminConsumerKey_Sandbox dummy
          pod keys set GarminConsumerSecret_Sandbox dummy
          pod keys set GarminConsumerKey dummy
          pod keys set GarminConsumerSecret dummy
          pod install --repo-update
          
      - name: Fetch Signing Files
        script: |
          cd ADAC
          
          # 1. Fix Team ID Mismatch (UCNNRR6B3Y -> ZT6KZUP4U2)
          sed -i '' 's/UCNNRR6B3Y/ZT6KZUP4U2/g' ADAC.xcodeproj/project.pbxproj
          
          # 2. Use Production APS environment for Release build
          sed -i '' 's/aps-environment<\/key>.*<string>development/aps-environment<\/key>\n\t<string>production/g' ADAC/ADAC.entitlements
          
          # 3. Fetch BOTH Development and App Store profiles for all 5 targets
          for id in "com.anydistance.anydistance" \
                    "com.anydistance.anydistance.Widget" \
                    "com.anydistance.anydistance.OneSignalNotificationServiceExtension" \
                    "com.anydistance.anydistance.watchkitapp" \
                    "com.anydistance.anydistance.watchkitapp.watchkitextension"; do
            app-store-connect fetch-signing-files "$id" --type IOS_APP_DEVELOPMENT --create
            app-store-connect fetch-signing-files "$id" --type IOS_APP_STORE --create
          done
          
          # Add certificates to keychain
          keychain add-certificates
          
          # 4. Apply profiles to Xcode project
          # Note: We removed the manual 'sed' for ProvisioningStyle = Manual.
          # use-profiles will handle the transition from Automatic to Manual correctly.
          xcode-project use-profiles --project ADAC.xcodeproj
          
          # DEBUG: Check signing state after tool runs
          echo "--- Signing State Debug ---"
          grep -E "ProvisioningStyle|CODE_SIGN_STYLE|DEVELOPMENT_TEAM" ADAC.xcodeproj/project.pbxproj | head -n 20
          
      - name: Build App
        script: |
          cd ADAC
          # Explicitly setting CODE_SIGN_STYLE to Manual to ensure archive step uses profiles
          xcodebuild -workspace "ADAC.xcworkspace" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath ../build/ADAC.xcarchive \
            CODE_SIGN_STYLE="Manual" \
            archive
          
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ADAC.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist ADAC/export_options.plist
          
    artifacts:
      - build/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true