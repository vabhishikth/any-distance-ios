workflows:
  ios-native-production:
    name: Native iOS & Watch Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Build Key"
    environment:
      vars:
        XCODE_WORKSPACE: "ADAC/ADAC.xcworkspace"
        XCODE_SCHEME: "ADAC"
    scripts:
      - name: Initialize Keychain
        script: keychain initialize
        
      - name: Fetch Signing Files (iPhone & Watch)
        script: |
          # This command fetches profiles for all targets in your workspace
          app-store-connect fetch-signing-files "$(xcode-project detect-bundle-id)" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          
      - name: Install CocoaPods
        script: |
          cd ADAC
          rm -rf Pods
          rm -f Podfile.lock
          gem install cocoapods
          pod repo update
          pod install --repo-update
          cd ..
          
      - name: Build and Sign (iPhone + Watch Ultra)
        script: |
          # Added -allowProvisioningUpdates to fix the Status Code 65 error
          xcodebuild -workspace "$XCODE_WORKSPACE" \
          -scheme "$XCODE_SCHEME" \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/MyApp.xcarchive \
          -allowProvisioningUpdates \
          archive
          
      - name: Generate Artifact
        script: |
          xcodebuild -exportArchive \
          -archivePath build/MyApp.xcarchive \
          -exportPath build/ \
          -exportOptionsPlist export_options.plist
          
    artifacts:
      - build/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true